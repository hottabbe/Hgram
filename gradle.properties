## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=7175
APP_VERSION_NAME=13.0.2
APP_PACKAGE=org.telegram.messenger
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
# Device-friendly limits (Xiaomi Pad 8, 12 GB RAM shared with background apps):
# smaller heap, daemon exits after 30 s idle so its memory is released after the build,
# and at most 2 parallel Gradle workers / Kotlin daemon heap capped.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.daemon.idletimeout=30000
org.gradle.workers.max=10
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.parallel=true
org.gradle.configureondemand=false
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,EXTERNAL_NATIVE_BUILD_CONFIGURATION,JAVA_COMPILE_DEPRECATED_SOURCE_TARGET
org.gradle.tooling.parallel=true
# Device-specific (Xiaomi Pad 8, arm64): build only arm64-v8a, use Debian aapt2 (aarch64)
nativeTarget=arm64-v8a
# android.aapt2FromMavenOverride=/usr/bin/aapt2
APP_BUILD_TIMESTAMP=2000000000000
