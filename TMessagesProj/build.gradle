def verName = APP_VERSION_NAME
def verCode = 1307


def officialVer = APP_VERSION_NAME
def officialCode = APP_VERSION_CODE

def serviceAccountCredentialsFile = rootProject.file("service_account_credentials.json")

def beta = verName.contains("preview")

if (serviceAccountCredentialsFile.isFile()) {
    setupPlay(beta)
    play.serviceAccountCredentials = serviceAccountCredentialsFile
} else if (System.getenv().containsKey("ANDROID_PUBLISHER_CREDENTIALS")) {
    setupPlay(beta)
}

void setupPlay(boolean beta) {
    apply plugin: "com.github.triplet.play"
    play {
        track = beta ? "beta" : "production"
        defaultToAppBundles = true
    }
}

configurations {
    compile.exclude module: "support-v4"
}

def keystorePwd = null
def alias = null
def pwd = null
def sentry_token = System.getenv("SENTRY_AUTH_TOKEN")
def nagram_build_args = System.getenv("NAGRAM_BUILD_ARGS")
def disableCMakeRelWithDebInfo = System.getenv("COMPILE_NATIVE") == null

Properties properties
def base64 = System.getenv("LOCAL_PROPERTIES")
if (base64 != null && !base64.isBlank()) {
    properties = new Properties()
    properties.load(new ByteArrayInputStream(Base64.decoder.decode(base64)))
} else if (project.rootProject.file("local.properties").exists()) {
    properties = new Properties()
    properties.load(project.rootProject.file("local.properties").newDataInputStream())
}

def keystoreFile = null
if (properties != null) {
    keystorePwd = properties.getProperty("KEYSTORE_PASS")
    alias = properties.getProperty("ALIAS_NAME")
    pwd = properties.getProperty("ALIAS_PASS")
    keystoreFile = properties.getProperty("KEYSTORE_FILE")
    sentry_token = properties.getProperty("SENTRY_AUTH_TOKEN", sentry_token)
    nagram_build_args = properties.getProperty("NAGRAM_BUILD_ARGS", nagram_build_args)
}

keystorePwd = keystorePwd ?: System.getenv("KEYSTORE_PASS")
alias = alias ?: System.getenv("ALIAS_NAME") ?: "key0"
pwd = pwd ?: System.getenv("ALIAS_PASS") ?: keystorePwd
keystoreFile = keystoreFile ?: System.getenv("KEYSTORE_FILE")

File releaseStoreFile
if (keystoreFile != null && !keystoreFile.isBlank()) {
    releaseStoreFile = rootProject.file(keystoreFile).exists() ? rootProject.file(keystoreFile) : project.file(keystoreFile)
} else if (rootProject.file("key.jks").exists()) {
    releaseStoreFile = rootProject.file("key.jks")
} else if (project.file("key.jks").exists()) {
    releaseStoreFile = project.file("key.jks")
} else {
    releaseStoreFile = project.file("release.keystore")
}

def sentry_upload = sentry_token != null && !sentry_token.isEmpty()

def targetTask = ""
if (!gradle.startParameter.taskNames.isEmpty()) {
    if (gradle.startParameter.taskNames.size == 1) {
        targetTask = gradle.startParameter.taskNames[0].toLowerCase()
    }
}

def nativeTarget = System.getenv("NATIVE_TARGET")
if (nativeTarget == null) nativeTarget = project.findProperty("nativeTarget") ?: ""

android {
    compileSdk = 36
    ndkVersion rootProject.ext.ndkVersion // 29.0.14206865

    defaultConfig.applicationId = "org.hgram"

    sourceSets {

        main {
            assets.srcDirs = ["src/main/assets"]
        }

        debug {
            java {
                srcDirs "src/main/java"
            }
            jniLibs {
                srcDir "src/main/libs"
            }
        }

        release {
            java {
                srcDirs "src/main/java"
            }
            jniLibs {
                srcDir "src/main/libs"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "jni/CMakeLists.txt"
        }
    }

    lint {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11

        coreLibraryDesugaringEnabled true
    }

    splits {

        abi {
            if (targetTask.contains("fdroid")) {
                enable false
                universalApk true
            } else {
                enable true
                reset()
                universalApk false
                if (!nativeTarget.isBlank()) {
                    include nativeTarget
                } else {
                    include 'armeabi-v7a', 'arm64-v8a'
                }
            }
        }

    }

    defaultConfig {
        minSdk = 23
        //noinspection ExpiredTargetSdkVersion,OldTargetApi
        targetSdk = 36

        versionName verName
        versionCode verCode

        def appId = "11535358"
        def appHash = "33d372962fadb01df47e6ceed4e33cd6"

        //obtain your own keys at https://core.telegram.org/api/obtaining_api_id

        if (properties != null) {
            appId = properties.getProperty("TELEGRAM_APP_ID") ?: System.getenv("TELEGRAM_APP_ID") ?: appId
            appHash = properties.getProperty("TELEGRAM_APP_HASH") ?: System.getenv("TELEGRAM_APP_HASH") ?: appHash
        }

        buildConfigField "String", "BUILD_VERSION_STRING", "\"" + verName + "\""
        buildConfigField "long", "BUILD_TIMESTAMP", APP_BUILD_TIMESTAMP + ""
        buildConfigField "String", "OFFICIAL_VERSION", "\"" + officialVer + "\""
        buildConfigField "int", "OFFICIAL_VERSION_CODE", officialCode + ""
        buildConfigField "int", "APP_ID", appId
        buildConfigField "String", "APP_HASH", "\"" + appHash + "\""

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                // Nagram: reuse compiled objects via ccache (if installed) so clean rebuilds don't recompile absl/webrtc/tgnet
                if (new File('/usr/bin/ccache').exists() || new File('/usr/local/bin/ccache').exists()) {
                    arguments '-DCMAKE_C_COMPILER_LAUNCHER=ccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
                }
                targets 'tmessages.49'
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        release {
            storeFile releaseStoreFile

            if (keystorePwd && alias && pwd) {
                storePassword keystorePwd
                keyAlias alias
                keyPassword pwd
            }

            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            isDefault true
            debuggable true
            jniDebuggable true
            multiDexEnabled true
            signingConfig signingConfigs.debug

            externalNativeBuild {
                cmake {
                    arguments "-DNAGRAM_DEBUG_BUILD=ON"
                }
            }
        }


        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            matchingFallbacks = ["release", "debug"]
            signingConfig signingConfigs.release
        }
    }

    gradle.taskGraph.whenReady { graph ->
        def releaseRequested = graph.allTasks.any { task ->
            task.project == project &&
                    task.name.toLowerCase().matches(".*(release).*") &&
                    (task.name.startsWith("assemble") ||
                            task.name.startsWith("bundle") ||
                            task.name.startsWith("package"))
        }

        if (releaseRequested && (!keystorePwd || !alias || !pwd)) {
            throw new GradleException(
                    "Release signing requires KEYSTORE_PASS, ALIAS_NAME and ALIAS_PASS"
            )
        }
    }

    flavorDimensions += "version"

    packaging {
        jniLibs {
            excludes += ['/fabric/**', '/META-INF/native-image/**']
            useLegacyPackaging true
        }
        resources {
            excludes += [
                '/fabric/**', '/META-INF/*.version', '/META-INF/*.kotlin_module',
                '/META-INF/native-image/**', '/builddef.lst', '/*.txt', '/DebugProbesKt.bin',
                '/okhttp3/internal/publicsuffix/NOTICE', 'META-INF/INDEX.LIST',
                'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES*',
                'META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/*.md'
            ]
        }

        def lib = "libtmessages.*.so"
        pickFirst "lib/armeabi-v7a/$lib"
        pickFirst "lib/arm64-v8a/$lib"
    }

    buildFeatures {
        buildConfig true
    }

    tasks.configureEach { task ->
        def prebuiltExists = project.file("src/main/libs").exists() && project.file("src/main/libs").listFiles()?.length > 0
        if (prebuiltExists && ((task.name.endsWith("Ndk") || task.name.startsWith("generateJsonModel") || task.name.startsWith("externalNativeBuild"))) && !task.name.contains("Debug")) {
            task.enabled = false
        }
        if (task.name.contains("uploadCrashlyticsMappingFile")) {
            enabled = false
        }
        if (disableCMakeRelWithDebInfo && task.name.contains("CMakeRelWithDebInfo")) {
            enabled = false
        }
    }

    tasks.configureEach { task ->
        if (task.name.startsWith("uploadCrashlyticsMappingFile")) {
            task.enabled = false
        } else if (task.name.contains("Crashlytics") && task.name.contains("NoGcm")) {
            task.enabled = false
        } else if (task.name.endsWith("GoogleServices") && task.name.contains("NoGcm")) {
            task.enabled = false
        } else if (task.name.contains("buildCMakeDebug") && nagram_build_args != null && nagram_build_args.contains("skip_buildCMakeDebug")) {
            task.enabled = false
        }
    }

    namespace "org.telegram.messenger"
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            String gramName = "Hgram"
            String first = String.format("%s-v%s(%s)", gramName, verName, verCode)
            try {
                if (output.hasProperty('outputFileName')) {
                    def currentName = output.outputFileName instanceof org.gradle.api.provider.Property ? output.outputFileName.get() : output.outputFileName
                    def name = currentName.replace("TMessagesProj", first).replace("-release", "")
                    if (output.outputFileName instanceof org.gradle.api.provider.Property) {
                        output.outputFileName.set(name)
                    } else {
                        output.outputFileName = name
                    }
                }
            } catch (Exception ignored) {
            }
        }
    }
}

